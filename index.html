<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Babaji</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }
        .banner {
            width: 100%;
            height: 70vh;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .banner h1 {
            font-size: 4.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .banner p {
            font-size: 1.5rem;
            font-weight: 300;
        }
        .content {
            padding: 40px;
            text-align: center;
            font-size: 1.2rem;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="banner">
        <h1>Hello World Babaji</h1>
        <p>Welcome to your magnificent web page banner!</p>
    </div>

    <div class="content">
        <p>Your main website content goes right here.</p>
    </div>

</body>
</html>
